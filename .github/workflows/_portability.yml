name: Verify distribution portability fixes
on:
  push:
    branches: [codex/official-installers-20260920]
    paths: [.github/workflows/_portability.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Isolate os-release variables and complete portable test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              assert text.count(old)==1, (path,old[:80],text.count(old))
              p.write_text(text.replace(old,new),encoding='utf-8')
          replace('templates/lib/external.sh', '''    local ID='' ID_LIKE=''
              if [ -f "${LMM_OS_RELEASE:-/etc/os-release}" ]; then
                # shellcheck disable=SC1090
                . "${LMM_OS_RELEASE:-/etc/os-release}"
              fi
              case " $ID $ID_LIKE " in''', '''    local distro_info
              distro_info=$(
                ID='' ID_LIKE=''
                if [ -f "${LMM_OS_RELEASE:-/etc/os-release}" ]; then
                  # Do not let os-release VERSION replace the requested tool version.
                  # shellcheck disable=SC1090
                  . "${LMM_OS_RELEASE:-/etc/os-release}"
                fi
                printf '%s %s\\n' "$ID" "$ID_LIKE"
              )
              case " $distro_info " in''')
          replace('tests/test_external.py', "elif name=='ldd':", "elif name=='realpath': print(os.path.realpath(args[-1]))\nelif name=='ldd':")
          replace('tests/test_external.py', "('uname','ldd','curl','proot-distro',", "('uname','realpath','ldd','curl','proot-distro',")
          replace('tests/test_external.py', "self.release.write_text(f'ID={distro}\\n')", "self.release.write_text(f'ID={distro}\\nVERSION=\"24.04.5 LTS (Noble Numbat)\"\\nNAME=\"Fixture Linux\"\\n')")
          replace('tests/test_external.py', '    def test_partial_upstream_script_is_not_executed(self):', '''    def test_os_release_does_not_override_tool_version(self):
                  for target, expected in [('codex', ['--release', 'latest']), ('claude-code', ['stable'])]:
                      r=self.run_tool(target, '--update')
                      self.assertEqual(r.returncode, 0, r.stderr)
                      self.assertEqual((self.base/'args').read_text().splitlines(), expected)
                  r=self.run_tool('codex', '--version', '1.2.3')
                  self.assertEqual(r.returncode, 0, r.stderr)
                  self.assertEqual((self.base/'args').read_text().splitlines(), ['--release', '1.2.3'])

              def test_partial_upstream_script_is_not_executed(self):''')
          p=Path('tools/catalog.py')
          with p.open('a',encoding='utf-8') as f:
              f.write("MANAGED = tuple(name for name, _, kind in TOOLS if kind == 'managed')\n")
          replace('tools/generate.py', 'from catalog import EXTERNAL', 'from catalog import EXTERNAL, MANAGED')
          replace('tools/generate.py', "for target in ('pi', 'dsh', 'lmm'):", 'for target in MANAGED:')
          PY
          python3 -m py_compile tests/test_external.py tools/generate.py
          python3 tests/test_external.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/lib/external.sh tests/test_external.py tools/catalog.py tools/generate.py
          git commit -m 'fix: keep distro metadata out of installer state and isolate Termux test tools'
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('versions.json'); v=json.loads(p.read_text(encoding='utf-8'))
          v['library_revision']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          v['script_version']='2026.09.20.5'
          p.write_text(json.dumps(v,indent=2)+'\n',encoding='utf-8')
          PY
          python3 tools/generate.py
          python3 tools/generate.py --check
          python3 tests/test_installers.py
          python3 tests/test_official_policy.py
          python3 tests/test_library_loader.py
          shellcheck *.sh
          git add versions.json '*.sh' '*.ps1'
          git commit -m 'fix: pin generated installers to corrected distribution detection'
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          p=Path('tools/generate_menus.py')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          text,count=re.subn(r"revision='[0-9a-f]{40}'",f"revision='{sha}'",p.read_text(encoding='utf-8'))
          assert count==1
          p.write_text(text,encoding='utf-8')
          PY
          python3 tools/generate_menus.py
          python3 tools/generate_menus.py --check
          python3 tests/test_catalog.py
          git add tools/generate_menus.py menu.sh menu.ps1
          git commit -m 'fix: update seven-tool menu to tested installer revision'
          git push origin HEAD:codex/official-installers-20260920
