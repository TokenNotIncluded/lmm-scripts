name: Extended installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.x'
      - run: python tools/generate.py --check
      - run: python tools/generate_menus.py --check
      - run: python tests/test_catalog.py
      - name: Distribution and Termux routing
        if: runner.os != 'Windows'
        run: python3 tests/test_external.py
      - name: PowerShell entries
        shell: pwsh
        run: ./tests/test-external.ps1
      - name: Windows PowerShell 5.1 entries
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test-external.ps1
      - name: Real upstream CLI installs on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-profile"
          export CODEX_INSTALL_DIR="$RUNNER_TEMP/codex-bin"
          bash codex.sh
          bash codex.sh --check
          bash claude-code.sh
          bash claude-code.sh --check
      - name: Real upstream CLI and portable CC Switch installs on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CODEX_HOME="$env:RUNNER_TEMP\codex-profile"
          $env:CODEX_INSTALL_DIR="$env:RUNNER_TEMP\codex-bin"
          .\codex.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Codex install failed' }
          .\codex.ps1 -Check
          if ($LASTEXITCODE -ne 0) { throw 'Codex check failed' }
          .\claude-code.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Claude install failed' }
          .\claude-code.ps1 -Check
          if ($LASTEXITCODE -ne 0) { throw 'Claude check failed' }
          .\cc-switch.ps1 -Root "$env:RUNNER_TEMP\cc switch"
          if ($LASTEXITCODE -ne 0) { throw 'CC Switch installation failed' }
          .\cc-switch.ps1 -Root "$env:RUNNER_TEMP\cc switch" -Check
          if ($LASTEXITCODE -ne 0) { throw 'CC Switch check failed' }
  linux-libc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'alpine:3.22']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install CLIs in a clean glibc or musl userland
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "$IMAGE" sh -ec '
            if command -v apk >/dev/null; then apk add --no-cache bash curl ca-certificates;
            else apt-get update && apt-get install -y bash curl ca-certificates; fi
            export LMM_LIB_DIR=/src/templates/lib
            bash /src/codex.sh --install-deps
            bash /src/codex.sh --check
            bash /src/claude-code.sh --install-deps
            bash /src/claude-code.sh --check
          '
