name: Magpie offline checks
on:
  pull_request:
    paths:
      - 'magpie.*'
      - 'menu.*'
      - 'test-magpie.*'
      - '.github/workflows/magpie.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Bash installer and menu contracts
        if: runner.os != 'Windows'
        run: python3 test-magpie.py
      - name: PowerShell contracts
        shell: pwsh
        run: ./test-magpie.ps1
      - name: Windows PowerShell 5.1 contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: .\test-magpie.ps1
