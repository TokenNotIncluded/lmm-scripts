name: Validate installer upgrade
on:
  push:
    branches: [chore/plugin-compat-20261006]
    paths: [.github/workflows/compatibility-upgrade.yml]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.ref == 'refs/heads/chore/plugin-compat-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/plugin-compat-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create an immutable updated helper revision
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('codewhale.mjs')
          s = p.read_text()
          assert "PROVIDER_REV = '8c78be0f936fb8f508badabc0195cdb21442a75d'" in s
          s = s.replace('8c78be0f936fb8f508badabc0195cdb21442a75d', 'adad64b7ac77ec997b5be4662c6b6ccf36998357')
          s = s.replace('api-key|config|config-path)', 'api-key|config|config-path|profile)')
          s = s.replace('configuration or credentials', 'configuration, profile or credentials')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codewhale.mjs
          git commit -m 'fix: update the Codewhale adapter and protect profile routing'
      - name: Bind both bootstrap launchers to the exact helper bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          digest = hashlib.sha256(Path('codewhale.mjs').read_bytes()).hexdigest()
          for name in ['codewhale.sh', 'codewhale.ps1', 'test-codewhale.mjs']:
              p = Path(name)
              s = p.read_text().replace('354a0e7e8597957b33f5d4f4afcf9ac7ebfe8693', revision)
              s = s.replace('d985a055e9f5a95ad8b358d3569f4a9d33a1eaca52dffa39c4b8aa2268a3bbf1', digest)
              if name == 'test-codewhale.mjs':
                  s = s.replace("'--base-url=x']", "'--base-url=x', '--profile', '--profile=personal']")
                  s += "\ntest('native prompt and continue short flags are not mistaken for route overrides', () => {\n  assert.deepEqual(parseArguments(['run', '--', '-p', 'hello', '-c']).forwarded, ['-p', 'hello', '-c']);\n});\n"
              p.write_text(s)
          p = Path('CODEWHALE.md')
          s = p.read_text().replace('8c78be0f936fb8f508badabc0195cdb21442a75d', 'adad64b7ac77ec997b5be4662c6b6ccf36998357')
          s += '\n新版 Codewhale 的 `--profile` 不能透传覆盖 LMM 临时配置；原生 `-p`（提示词）和 `-c`（继续会话）保持可用。Bash 与 PowerShell 的独立下载入口固定到同一份助手提交，并校验相同 SHA-256。\n'
          p.write_text(s)
          print('Pinned helper revision:', revision)
          print('Pinned helper SHA-256:', digest)
          PY
      - name: Validate installer contracts
        run: |
          set -euo pipefail
          for script in *.sh; do bash -n "$script"; done
          node --test test-codewhale.mjs test-opencode.mjs test-opencode-entry.mjs
          python3 test-codewhale-menu.py
          python3 test.py
          python3 test-ai-tools.py
          shellcheck *.sh
          pwsh -NoProfile -File ./test-codewhale.ps1
      - name: Push only after the helper and both launchers validate together
        run: |
          set -euo pipefail
          git add codewhale.sh codewhale.ps1 test-codewhale.mjs CODEWHALE.md
          git commit -m 'fix: synchronize verified Codewhale bootstrap revisions and tests'
          git push origin HEAD:refs/heads/chore/plugin-compat-20261006
