name: Prepare Windows profile installer pin
on:
  push:
    branches: [fix/windows-profile-installer-20261006]
    paths: [.github/workflows/prepare-windows-profile-pin.yml]
permissions:
  contents: read
concurrency:
  group: prepare-windows-profile-installer
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/windows-profile-installer-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-profile-installer-20261006
          fetch-depth: 1
      - name: Update source pin and bind verified launchers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          old_provider = 'adad64b7ac77ec997b5be4662c6b6ccf36998357'
          new_provider = '62eb05b40f1dda7b844b5430ad2b735e66508aa0'
          old_helper = '319d9790ba026583ea226fb92b13b366b738c3ef'
          old_digest = '91dcff456f04abb0ef0ff7f95742ff3d332bfb2c93b4b067f4d778008556f69c'

          def replace_once(path, old, new):
              file = Path(path)
              data = file.read_bytes()
              assert data.count(old.encode()) == 1, f'{path}: expected exactly one old pin'
              file.write_bytes(data.replace(old.encode(), new.encode()))

          replace_once('codewhale.mjs', old_provider, new_provider)
          replace_once('CODEWHALE.md', old_provider, new_provider)
          subprocess.run(['git', 'add', 'codewhale.mjs', 'CODEWHALE.md'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: pin Codewhale Windows environment isolation'], check=True)
          helper = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          digest = hashlib.sha256(Path('codewhale.mjs').read_bytes()).hexdigest()
          for path in ['codewhale.sh', 'codewhale.ps1']:
              replace_once(path, old_helper, helper)
              replace_once(path, old_digest, digest)
          replace_once('test-codewhale.mjs', old_helper, helper)
          Path('.github/workflows/prepare-windows-profile-pin.yml').unlink()
          subprocess.run(['git', 'add', 'codewhale.sh', 'codewhale.ps1', 'test-codewhale.mjs', '.github/workflows/prepare-windows-profile-pin.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: bind both Codewhale bootstraps to verified helper bytes'], check=True)
          print(f'Provider: {new_provider}\nHelper: {helper}\nSHA256: {digest}')
          PY
          git diff --exit-code
          git push origin HEAD:refs/heads/fix/windows-profile-installer-20261006
