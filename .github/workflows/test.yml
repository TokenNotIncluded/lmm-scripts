name: Installer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.x'
      - name: PowerShell contracts
        shell: pwsh
        run: ./test.ps1
      - name: PowerShell 5.1 contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: .\test.ps1
      - name: Real Windows CLI installs (DSH instrumented diagnostic)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PI_CODING_AGENT_DIR="$env:RUNNER_TEMP\pi-profile"
          # Expose only this job's chosen install path; no persistent user PATH changes.
          $env:PATH="$env:PI_CODING_AGENT_DIR\bin;$env:PATH"
          $env:DSH_HOME="$env:RUNNER_TEMP\dsh-profile"
          $env:CODEX_HOME="$env:RUNNER_TEMP\codex-profile"
          $env:CODEX_INSTALL_DIR="$env:RUNNER_TEMP\codex-bin"
          $env:CODEX_NON_INTERACTIVE='true'
          foreach ($tool in @('pi','dsh','codex','claude-code','lmm')) {
            Write-Host "Installing $tool"
            if ($tool -eq 'dsh') {
              python test-dsh-windows-stages.py
            } else {
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\$tool.ps1"
            }
            if ($LASTEXITCODE) { throw "$tool install failed: $LASTEXITCODE" }
          }
          foreach ($command in @("$env:PI_CODING_AGENT_DIR\bin\pi.cmd",'dsh.cmd',"$env:CODEX_INSTALL_DIR\codex.exe","$HOME\.local\bin\claude.exe","$HOME\.local\bin\lmm.exe")) {
            & $command --version
            if ($LASTEXITCODE) { throw "$command failed: $LASTEXITCODE" }
          }
