name: Installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.x'
      - run: python tools/generate.py --check
      - name: Shell fault-injection tests
        if: runner.os != 'Windows'
        run: python3 tests/test_installers.py
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck *.sh
      - name: PowerShell checks
        shell: pwsh
        run: ./tests/test-powershell.ps1
      - name: Windows PowerShell 5.1 checks
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test-powershell.ps1
      - name: Install real CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash lmm.sh --root "$RUNNER_TEMP/lmm tools" --no-path --network official
          "$RUNNER_TEMP/lmm tools/bin/lmm" --version
          "$RUNNER_TEMP/lmm tools/bin/lmm" catalog pi --json
          bash lmm.sh --root "$RUNNER_TEMP/lmm tools" --no-path --network official
      - name: Install real CLI on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\lmm.ps1 -Root "$env:RUNNER_TEMP\lmm 测试 tools" -NoPath -Network official
          if ($LASTEXITCODE -ne 0) { throw 'Installer or executable check failed' }
          & "$env:RUNNER_TEMP\lmm 测试 tools\bin\lmm.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI version failed' }
          & "$env:RUNNER_TEMP\lmm 测试 tools\bin\lmm.cmd" catalog pi --json
          if ($LASTEXITCODE -ne 0) { throw 'CLI catalog failed' }
          .\lmm.ps1 -Root "$env:RUNNER_TEMP\lmm 测试 tools" -NoPath -Network official
          if ($LASTEXITCODE -ne 0) { throw 'Installer or executable check failed' }
          .\lmm.ps1 -Root "$env:RUNNER_TEMP\lmm 测试 tools" -Check
          if ($LASTEXITCODE -ne 0) { throw 'Installer or executable check failed' }
      - name: Install real Pi and DSH on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PI_CODING_AGENT_DIR="$env:RUNNER_TEMP\pi-profile"
          $env:DSH_HOME="$env:RUNNER_TEMP\dsh profile 测试"
          $beforePath=$env:PATH
          $beforeRegistry=$env:npm_config_registry
          .\pi.ps1 -Root "$env:RUNNER_TEMP\lmm clients" -NoPath -Network official -InstallOnly
          if ($LASTEXITCODE -ne 0) { throw 'Installer or executable check failed' }
          .\dsh.ps1 -Root "$env:RUNNER_TEMP\lmm clients" -NoPath -Network official -InstallOnly
          if ($LASTEXITCODE -ne 0) { throw 'Installer or executable check failed' }
          .\pi.ps1 -Root "$env:RUNNER_TEMP\lmm clients" -Check
          if ($LASTEXITCODE -ne 0) { throw 'Installer or executable check failed' }
          .\dsh.ps1 -Root "$env:RUNNER_TEMP\lmm clients" -Check
          if ($LASTEXITCODE -ne 0) { throw 'Installer or executable check failed' }
          if ($env:PATH -ne $beforePath -or $env:npm_config_registry -ne $beforeRegistry) { throw 'Installer leaked process environment changes' }
