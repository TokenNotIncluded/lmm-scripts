name: Installer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.x'
      - name: Shell contracts
        if: runner.os != 'Windows'
        run: |
          python3 test.py
          python3 test-ai-tools.py
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck *.sh
      - name: PowerShell contracts
        shell: pwsh
        run: ./test.ps1
      - name: PowerShell 5.1 contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: .\test.ps1
      - name: Real Unix CLI installs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-profile" DSH_HOME="$RUNNER_TEMP/dsh-profile"
          export CODEX_HOME="$RUNNER_TEMP/codex-profile" CODEX_INSTALL_DIR="$RUNNER_TEMP/codex-bin"
          export CODEX_NON_INTERACTIVE=true
          bash pi.sh
          pi --version
          pi list
          bash dsh.sh
          dsh --version
          dsh plugin --profile web list --depth 0
          bash codex.sh
          "$CODEX_INSTALL_DIR/codex" --version
          bash claude-code.sh stable
          "$HOME/.local/bin/claude" --version
          bash lmm.sh
          "$HOME/.local/bin/lmm" --version
      - name: Real Windows CLI installs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PI_CODING_AGENT_DIR="$env:RUNNER_TEMP\pi-profile"
          # Expose Pi's chosen path to this parent process.
          $env:PATH="$env:PI_CODING_AGENT_DIR\bin;$env:PATH"
          $env:DSH_HOME="$env:RUNNER_TEMP\dsh-profile"
          $env:CODEX_HOME="$env:RUNNER_TEMP\codex-profile"
          $env:CODEX_INSTALL_DIR="$env:RUNNER_TEMP\codex-bin"
          $env:CODEX_NON_INTERACTIVE='true'
          $userPathBefore = [Environment]::GetEnvironmentVariable('Path','User')
          try {
            foreach ($tool in @('pi','dsh','codex','claude-code','lmm')) {
              Write-Host "Installing $tool"
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\$tool.ps1"
              if ($LASTEXITCODE) { throw "$tool install failed: $LASTEXITCODE" }
              if ($tool -eq 'dsh') {
                # A child cannot update its parent's PATH. Select and prove the new
                # persistent shim instead of accidentally invoking an old npm shim.
                $managedDsh = Join-Path $HOME '.local\bin\dsh.cmd'
                $env:PATH = (Split-Path -Parent $managedDsh) + ';' + $env:PATH
                if ((Get-Command dsh.cmd -CommandType Application).Source -ine $managedDsh) {
                  throw 'The real DSH check selected a different command.'
                }
              }
            }
            foreach ($command in @("$env:PI_CODING_AGENT_DIR\bin\pi.cmd",'dsh.cmd',"$env:CODEX_INSTALL_DIR\codex.exe","$HOME\.local\bin\claude.exe","$HOME\.local\bin\lmm.exe")) {
              & $command --version
              if ($LASTEXITCODE) { throw "$command failed: $LASTEXITCODE" }
            }
            & dsh.cmd plugin --profile web list --depth 0
            if ($LASTEXITCODE) { throw 'The installed DSH profile could not be read.' }
            $shimBefore = (Get-FileHash -LiteralPath $managedDsh -Algorithm SHA256).Hash
            $keep = Join-Path $env:DSH_HOME '.lmm-installer-preserve-test'
            [IO.File]::WriteAllText($keep,'retain this profile')
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\dsh.ps1
            if ($LASTEXITCODE) { throw 'Managed DSH repeat installation failed.' }
            if ((Get-FileHash -LiteralPath $managedDsh -Algorithm SHA256).Hash -ne $shimBefore) {
              throw 'Repeat installation changed the selected runtime.'
            }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\dsh.ps1 -Action uninstall
            if ($LASTEXITCODE -or (Test-Path -LiteralPath $managedDsh)) { throw 'Managed DSH uninstall failed.' }
            if ([IO.File]::ReadAllText($keep) -cne 'retain this profile') { throw 'Uninstall changed profile data.' }
            $package = Join-Path $env:DSH_HOME 'lmm-provider-packages\21bc853b321906550cf529cecc83719e6d14fd70041cc7cb92e4aecd6316d3f1.tgz'
            if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ine '21bc853b321906550cf529cecc83719e6d14fd70041cc7cb92e4aecd6316d3f1') {
              throw 'Uninstall changed the verified provider package.'
            }
          } finally {
            [Environment]::SetEnvironmentVariable('Path',$userPathBefore,'User')
          }
  linux-libc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, alpine:3.22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Official installers without Node
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "$IMAGE" sh -ec '
            if command -v apk >/dev/null; then
              apk add --no-cache bash curl ca-certificates libgcc libstdc++ ripgrep
              export USE_BUILTIN_RIPGREP=0
            else
              apt-get update && apt-get install -y bash curl ca-certificates
            fi
            export CODEX_NON_INTERACTIVE=true
            bash /src/codex.sh
            /root/.local/bin/codex --version
            bash /src/claude-code.sh stable
            /root/.local/bin/claude --version
          '
